services:
  - type: web
    name: sentinel-chain
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
